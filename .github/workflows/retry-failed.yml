name: retry-failed

# Manual recovery path: rebuild and republish every package with an open
# build-failure issue. Successful retries close their issue in build-publish;
# packages that still fail retain the issue for the next retry.

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: >-
          Reuse the pacman package cache. Untick if a failure might be
          caused by something a cached package downloaded on an earlier
          attempt (rare, but this is a recovery path — worth the option).
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: read
  id-token: write
  attestations: write

jobs:
  build-publish:
    uses: Akaere-s-Packages/workflow-build-kit/.github/workflows/build-publish.yml@main
    with:
      retry-failed: true
      use-cache: ${{ inputs.use-cache }}
    secrets: inherit
