name: rebuild-all

# Manual escape hatch: rebuilds and republishes every package in the
# registry, regardless of what actually changed. Use this after a
# workflow-build-kit fix that should apply retroactively (e.g. a
# backends/archlinux/build.sh bug), after rotating the GPG signing key, or
# to recover from a bad publish — not part of the normal per-change flow.

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: >-
          Reuse the pacman package cache. Untick for a guaranteed
          clean-room rebuild — this is the escape hatch most likely to be
          run specifically because a cached package might be the problem.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: read
  id-token: write
  attestations: write

jobs:
  build-publish:
    uses: Akaere-s-Packages/workflow-build-kit/.github/workflows/build-publish.yml@main
    with:
      rebuild-all: true
      use-cache: ${{ inputs.use-cache }}
    secrets: inherit
